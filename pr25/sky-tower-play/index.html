<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SKY TOWER</title>
<script src="../watch-shim.js"></script>
<script>
(function(){const OK=u=>{try{const x=new URL(u,location.href);return x.origin===location.origin}catch(e){return false}};
const f0=window.fetch.bind(window);window.fetch=(u,o)=>OK(typeof u==='string'?u:u.url)?f0(u,o):Promise.reject(new Error('arcade: off-site request blocked'));
window.XMLHttpRequest=function(){throw new Error('arcade: XHR disabled')};
window.WebSocket=function(){throw new Error('arcade: network disabled')};
window.EventSource=function(){throw new Error('arcade: network disabled')};
if(navigator.sendBeacon)navigator.sendBeacon=()=>false;})();
</script>
<script src="../ticket-art.js"></script>
<script>
(function(){
  var q = window.__skyQ = { demo: false, start: false };
  window.__demo = { on: false, start: function () { q.demo = true; this.on = true; }, stop: function () { q.demo = false; this.on = false; } };
  window.__skytower = {
    start: function () { q.start = true; },
    scene: function () { return 'title'; },
    active: function () { return false; },
    hold: function () { return false; },
    unhold: function () {},
    ready: false
  };
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#061018;color:#fff;font-family:"Courier New",monospace;touch-action:none}
canvas{display:block;width:100%;height:100%}
#plat{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);z-index:20;font:900 16px/1.2 "Courier New",monospace;letter-spacing:.08em;color:#ffe14a;text-shadow:0 0 8px #000,0 0 10px #ffb000;background:#0008;border:2px solid #ffe14a88;border-radius:10px;padding:6px 14px;pointer-events:none}
#hp{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:20;font:900 20px/1 "Courier New",monospace;color:#ff4a4a;text-shadow:0 0 8px #000;pointer-events:none}
#best{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:20;font:800 12px/1 "Courier New",monospace;letter-spacing:.1em;color:#9fe8ff;text-shadow:0 0 6px #000;pointer-events:none}
#tixHud{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(36px,calc(env(safe-area-inset-top) + 28px));z-index:20;font:900 15px/1 "Courier New",monospace;color:#ffe14a;text-shadow:0 0 8px #000,0 0 10px #ffb000;pointer-events:none}
#plusLayer{position:fixed;inset:0;pointer-events:none;z-index:35}
.skyPlus{position:absolute;font:900 22px/1 "Courier New",monospace;color:#ffe14a;text-shadow:0 0 8px #000,0 0 14px #ffb000;transform:translate(-50%,-50%);animation:skyPlus .85s ease-out forwards}
@keyframes skyPlus{to{opacity:0;transform:translate(-50%,-140%)}}
#flyHud{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:22;display:flex;flex-direction:column;align-items:center;gap:6px;touch-action:none}
#flyHud b{font:900 10px/1 "Courier New",monospace;letter-spacing:.14em;color:#ffe0b0;text-shadow:0 0 6px #ff8a1a}
#flyMeter{width:74px;height:12px;border-radius:6px;border:2px solid #ffb060;background:#140804e6;overflow:hidden;box-shadow:0 0 8px #ff8a1a88}
#flyMeter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3b1a,#ffb020 55%,#ffe080);transform-origin:left center;transform:scaleX(1)}
#flyMeter.low i{background:#ff3030}
#btns{display:flex;align-items:flex-end;gap:14px}
#bFire,#bFly{width:74px;height:74px;border-radius:50%;color:#fff;font:900 15px/1 "Courier New",monospace;letter-spacing:.05em;padding:0;cursor:pointer}
#bFly{border:3px solid #ffb020;background:radial-gradient(circle at 50% 42%,#4a2a08f2,#120804f2);text-shadow:0 0 8px #ff8a1a;box-shadow:0 0 14px #ff8a1a99,inset 0 0 12px #ff8a1a44}
#bFly.on{border-color:#fff6d0;background:radial-gradient(circle at 50% 42%,#ff9a2acc,#3a1404f2)}
#bFire{border:3px solid #ff6060;background:radial-gradient(circle at 50% 42%,#4a1010f2,#140404f2);text-shadow:0 0 8px #ff3030;box-shadow:0 0 14px #ff303099,inset 0 0 12px #ff303044}
#bFire.on{border-color:#ffd0d0;background:radial-gradient(circle at 50% 42%,#ff4040cc,#3a0808f2)}
@media (pointer:fine){#bFly::after{content:"SPACE";display:block;margin-top:4px;font-size:9px;letter-spacing:.12em;color:#ffd098}#bFire::after{content:"F / J";display:block;margin-top:4px;font-size:9px;letter-spacing:.12em;color:#ffc0c0}}
#joy{position:fixed;left:max(18px,calc(env(safe-area-inset-left) + 10px));bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));width:120px;height:120px;border-radius:50%;pointer-events:none;z-index:21}
#joyBase{position:absolute;inset:10px;border-radius:50%;border:2px solid #ffffff88;background:radial-gradient(circle at 50% 42%,#ffffff40,#ffffff18 58%,#0000 74%)}
#joyKnob{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;left:60px;top:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c0d8ff 42%,#6a90c8);box-shadow:0 0 10px #9ad8ff88;border:2px solid #fff8}
#banner{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:30;font:900 28px/1.15 "Courier New",monospace;color:#ffe14a;text-align:center;text-shadow:0 0 12px #000,0 0 16px #ffb000;pointer-events:none;opacity:0;transition:opacity .25s}
#banner.on{opacity:1}
#banner.win{color:#fff6c8;font-size:34px}
body.demo #hp,body.demo #best{opacity:.35}
#windHud{position:fixed;left:50%;top:max(44px,calc(env(safe-area-inset-top) + 38px));transform:translateX(-50%);z-index:21;display:flex;align-items:center;gap:6px;font:900 13px/1 "Courier New",monospace;letter-spacing:.14em;color:#e8f8ff;text-shadow:0 0 8px #000,0 0 10px #4ac8ff;background:#0a1a2a99;border:2px solid #9fe8ff88;border-radius:10px;padding:4px 10px;pointer-events:none;opacity:0;transition:opacity .2s}
#windHud.on{opacity:1}
#windHud.warn{animation:windBlink .32s steps(2) infinite}
#windHud.gust{border-color:#e8f8ff;box-shadow:0 0 12px #4ac8ffaa}
#windArrow{display:inline-block;font-size:18px;line-height:1;transition:transform .15s}
@keyframes windBlink{50%{opacity:.35}}
</style>
</head>
<body>
<div id="plat">PLATFORM 1/50</div>
<div id="hp">♥♥♥</div>
<div id="best">BEST 0</div>
<div id="tixHud">🎟 0</div>
<div id="plusLayer"></div>
<div id="windHud" aria-live="polite"><span id="windArrow">➜</span>WIND</div>
<div id="flyHud">
  <b>ENERGY</b>
  <div id="flyMeter" title="Jetpack energy"><i></i></div>
  <div id="btns">
    <button id="bFire" type="button" title="Fire lasers. F or J does the same.">FIRE</button>
    <button id="bFly" type="button" title="Hold to fly. Space does the same.">FLY</button>
  </div>
</div>
<div id="joy"><div id="joyBase"></div><div id="joyKnob"></div></div>
<div id="banner"></div>
<script src="snd.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
