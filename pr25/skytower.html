<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SKY TOWER direct (PR #25 PREVIEW)</title>
<link rel="icon" href="icons/icon-192.png">
<style>html,body{margin:0;height:100%;background:#061018;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#b{position:fixed;left:50%;bottom:max(6px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;font:900 11px/1 'Courier New',monospace;letter-spacing:.14em;color:#fff;background:#c01430dd;border:2px solid #ff6b7a;border-radius:8px;padding:5px 9px;pointer-events:none}
#r{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(40px,env(safe-area-inset-top));z-index:9;font:900 11px/1 'Courier New',monospace;letter-spacing:.1em;color:#fff;background:#0008;border:2px solid #9fe8ff88;border-radius:8px;padding:6px 9px}</style>
</head><body>
<!-- Preview-only launcher (not in the PR): opens the Sky Tower cabinet game straight into a climb.
     ?watch=1 keeps its storage in memory, and there is no arcade around it, so no tickets or best scores are saved. -->
<iframe id="g" src="sky-tower-play/index.html?watch=1" allow="autoplay; fullscreen"></iframe>
<button id="r" type="button">RESTART</button>
<div id="b">PREVIEW · PR #25 · SKY TOWER DIRECT</div>
<script>
var f=document.getElementById('g');
function go(){try{var w=f.contentWindow;if(w.__skytower&&w.__skytower.ready&&w.__skytower.start){w.__skytower.start();try{w.focus()}catch(e){}return}}catch(e){}setTimeout(go,150)}
f.addEventListener('load',go);
document.getElementById('r').onclick=function(){go()};
</script>
</body></html>
