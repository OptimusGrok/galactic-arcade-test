<script>
(function(){
'use strict';
const cv=document.getElementById('c');let g=cv.getContext('2d');
let W=0,H=0,DPR=1,L={};
const OL='#1a0a33';
// ---------- layout ----------
function resize(){DPR=Math.min(3,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);
  const bw=Math.min(W*0.96,H*0.62),bx=(W-bw)/2,mq=Math.max(54,H*0.09),tabH=34,top=mq+12+tabH+6,shelfH=Math.max(70,H*0.11),ctrlH=Math.max(120,H*0.17);
  const gb=H-shelfH-ctrlH-10;
  L={bx,bw,mq,tabH,top,gb,shelfH,ctrlH,ctrlY:gb+8,shelfY:H-shelfH};
  L.joy={x:bx+ctrlH*0.62,y:L.ctrlY+ctrlH/2,r:Math.min(ctrlH*0.38,70)};
  L.btn={x:bx+bw-ctrlH*0.62,y:L.ctrlY+ctrlH/2-8,r:Math.min(ctrlH*0.34,60)};
  L.reset={x:bx+bw-28,y:top+28,r:18};
  const tb=document.getElementById('ptab');if(tb){tb.style.top=(mq+12)+'px';tb.style.height=tabH+'px';}
  fitCam();}
// ---------- 3D camera ----------
const CAM={e:[0,2.7,4.8],t:[0,0.95,0]},CW=1.1,CD=1.0,CHT=2.5; // cabinet half-width, half-depth, height
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],nrm=a=>{const l=Math.hypot(...a)||1;return[a[0]/l,a[1]/l,a[2]/l];},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
let F=[0,0,-1],Rr=[1,0,0],U=[0,1,0],PF=1,PX=0,PY=0,yaw=0,hintT=6,orbit={id:null,lx:0,ly:0};
function setCam(){CAM.e=[Math.sin(yaw)*4.8,2.7,Math.cos(yaw)*4.8];
  const f=nrm(sub(CAM.t,CAM.e)),r=nrm(cross(f,[0,1,0])),u=cross(r,f);F=f;Rr=r;U=u;fitCam();}
function pr(x,y,z){const d=[x-CAM.e[0],y-CAM.e[1],z-CAM.e[2]],zz=dot(d,F);if(zz<.15)return{x:PX,y:PY,z:zz,k:0};return{x:PX+dot(d,Rr)/zz*PF,y:PY-dot(d,U)/zz*PF,z:zz,k:PF/zz};}
function fitCam(){PF=1;PX=0;PY=0;let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const x of[-CW,CW])for(const y of[0,CHT])for(const z of[-CD,CD]){const p=pr(x,y,z);if(p.z<.2)continue;x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}
  if(x1<=x0){x0=-1;x1=1;y0=-1;y1=1;}
  const vw=L.bw-24,vh=L.gb-L.top-10;PF=Math.min(vw/(x1-x0),vh/(y1-y0))*0.98;PX=L.bx+L.bw/2-(x0+x1)/2*PF;PY=L.top+6+vh/2-(y0+y1)/2*PF;}
function snapFront(){yaw=0;setCam();hintT=0;}
addEventListener('resize',()=>{resize();setCam();});
// ---------- world ----------
const CHUTE={x:-0.74,z:0.64,w:0.3},BIN=0.2,LIGHT=nrm([-0.4,1,0.6]);
const rnd=(a,b)=>a+Math.random()*(b-a);
let balls=[],toys=[],toy=null,shelf=[],msg='',msgT=0,wins=0,credits=0;
function inChute(x,z,m){return Math.abs(x-CHUTE.x)<CHUTE.w+m&&Math.abs(z-CHUTE.z)<CHUTE.w+m;}
function setupBalls(){balls=[];const cols=['#ff3b5c','#ffd23a','#3dd6ff','#3dff9a','#ff8a1f','#c66bff','#ffffff'];let i=0;
  for(let l=0;l<2;l++)for(let x=-CW+0.1;x<CW-0.05;x+=0.17)for(let z=-CD+0.1;z<CD-0.05;z+=0.17){const bx=x+rnd(-.03,.03)+(l?.08:0),bz=z+rnd(-.03,.03)+(l?.08:0);if(inChute(bx,bz,.12)||Math.abs(bx)>CW-.08||Math.abs(bz)>CD-.08)continue;
    balls.push({x:bx,z:bz,hx:bx,hz:bz,y:0.08+l*0.1,by:0.08+l*0.1,vx:0,vz:0,vy:0,c:cols[i++%7]});}}
const TIERS={common:{n:'COMMON',c:'#b8c4d6',w:60},uncommon:{n:'UNCOMMON',c:'#3dff9a',w:25},rare:{n:'RARE',c:'#3dd6ff',w:12},legendary:{n:'LEGENDARY',c:'#ffb020',w:3}};
const ROSTER=[['bear','Teddy Bear','common'],['bunny','Bunny','common'],['duck','Ducky','common'],['frog','Frog','common'],['cat','Kitty','uncommon'],['octopus','Octopus','uncommon'],['penguin','Penguin','rare'],['alien','Alien','rare'],['monkey','Monkey','legendary'],['grok','Grok','legendary']].map(([k,name,tier])=>({k,name,tier}));
const BYK={};ROSTER.forEach(r=>BYK[r.k]=r);
const NAMES={};ROSTER.forEach(r=>NAMES[r.k]=r.name);
const WINS={monkey:'You won a Monkey!',grok:'You won the Grok plush!'};ROSTER.forEach(r=>{if(!WINS[r.k])WINS[r.k]='You won a '+r.name+'!';});
function chance(k){const t=BYK[k].tier;return TIERS[t].w/ROSTER.filter(r=>r.tier===t).length;}
function rollKind(){let r=Math.random()*100;for(const o of ROSTER){r-=chance(o.k);if(r<0)return o.k;}return ROSTER[0].k;}
let coll={};try{coll=JSON.parse(localStorage.getItem('arcade_clawMachine.collection')||'{}')||{};}catch(e){}
function saveColl(){try{localStorage.setItem('arcade_clawMachine.collection',JSON.stringify(coll));}catch(e){}}
let toast=null;
function freeSpot(){let x,z,n=0;do{x=rnd(-.55,.65);z=rnd(-.55,.45);n++;}while(n<100&&(inChute(x,z,.2)||toys.some(o=>!o.fall&&Math.hypot(o.x-x,o.z-z)<.42)));return[x,z];}
function announce(kind){const r=BYK[kind],T=TIERS[r.tier];toast={text:(r.tier==='legendary'?'★ LEGENDARY: '+r.name+'! ★':'New: '+r.name+' · '+T.n),col:T.c,leg:r.tier==='legendary',t:2.8};if(toast.leg)setTimeout(sJingle,80);else tone(660,.12,'triangle',.08);}
function newToy(first,kind,opts){opts=opts||{};kind=kind||rollKind();const[x,z]=freeSpot();
  const t={kind,x,z,y:BIN,vy:0,sq:0,yaw:rnd(-.4,.4),held:false,fall:false,appear:opts.appear||0};toys.push(t);toy=toys.find(o=>!o.fall)||t;
  if(opts.announce)announce(kind);return t;}
function alive(){return toys.filter(o=>!o.fall&&!o.done);}
function refillBatch(){const need=8-alive().length;if(need<=0)return;const spawned=[];for(let i=0;i<need;i++)spawned.push(newToy(false,rollKind(),{appear:1}));
  spawned.sort((a,b)=>{const ra=BYK[a.kind].tier,rb=BYK[b.kind].tier;if(ra==='legendary'&&rb!=='legendary')return -1;if(rb==='legendary'&&ra!=='legendary')return 1;return TIERS[rb].w-TIERS[ra].w;});
  announce(spawned[0].kind);if(spawned.some(t=>BYK[t.kind].tier==='legendary'))toast={text:'★ LEGENDARY DROP! ★',col:TIERS.legendary.c,leg:true,t:3.2};
  tone(520,.1,'square',.08);noise(.12,.3,1800);}
let tgt=null; // toy targeted by the current drop
function nearest(){let b=null,bd=1e9;for(const t of toys){if(t.fall)continue;const d=Math.hypot(t.x-C.x,t.z-C.z);if(d<bd){bd=d;b=t;}}return b;}
// ---------- claw ----------
const HOME={x:0.35,z:0.1},TOPY=1.95,TS=0.9,HOFF=0.86,CS=0.75,GR=0.24;
const C={x:HOME.x,z:HOME.z,y:TOPY,open:0.15,st:'idle',t:0,held:false,grip:1,target:0};
let joy={id:null,dx:0,dy:0},keys={},btnDown=0;
function say(m){msg=m;msgT=2.4;}

let ac=null,whir=null;
function unlock(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),o2=ac.createOscillator(),f=ac.createBiquadFilter(),gn=ac.createGain();
  o.type='sawtooth';o.frequency.value=70;o2.type='square';o2.frequency.value=140.5;f.type='lowpass';f.frequency.value=600;gn.gain.value=0;
  o.connect(f);o2.connect(f);f.connect(gn).connect(ac.destination);o.start();o2.start();whir={gn,o};}catch(e){}}
function tone(f,d,type,vol,t0,f2){if(!ac)return;const t=ac.currentTime+(t0||0),o=ac.createOscillator(),gn=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  gn.gain.setValueAtTime(vol||.15,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn).connect(ac.destination);o.start(t);o.stop(t+d+.05);}
function noise(d,vol,fq){if(!ac)return;const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fq||800;gn.gain.value=vol||.4;s.connect(f).connect(gn).connect(ac.destination);s.start();}
const sGrab=()=>{tone(320,.08,'square',.12,0,160);tone(200,.12,'triangle',.18,.05,90);noise(.08,.25,2000);};
const sClunk=()=>{tone(120,.25,'sine',.4,0,45);noise(.18,.6,500);};
const sJingle=()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.18,'square',.09,i*.11));};
const sBuzz=()=>tone(160,.25,'sawtooth',.08,0,90);
const sCoin=()=>{tone(988,.12,'square',.1);tone(1319,.3,'square',.1,.08);};
function setWhir(on,pitch){if(!whir)return;const t=ac.currentTime;whir.gn.gain.setTargetAtTime(on?.07:0,t,.05);whir.o.frequency.setTargetAtTime(pitch||70,t,.1);}
function inJoy(x,y){return Math.hypot(x-L.joy.x,y-L.joy.y)<L.joy.r*1.9&&y>L.ctrlY-20;}
function inBtn(x,y){return Math.hypot(x-L.btn.x,y-L.btn.y)<L.btn.r*1.4;}
function joyMove(x,y){let dx=(x-L.joy.x)/L.joy.r,dy=(y-L.joy.y)/L.joy.r;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}joy.dx=dx;joy.dy=dy;}
function inMachine(x,y){return y>L.top-4&&y<L.ctrlY-8&&x>L.bx&&x<L.bx+L.bw;}
function inReset(x,y){return false;const r=L.reset;return r&&Math.hypot(x-r.x,y-r.y)<r.r;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();const x=e.clientX,y=e.clientY;
  if(inBtn(x,y)){drop();return;}
  if(inReset(x,y)){snapFront();return;}
  if(inJoy(x,y)&&joy.id===null){joy.id=e.pointerId;joy.active=true;joyMove(x,y);try{cv.setPointerCapture(e.pointerId);}catch(_){}return;}
  if(inMachine(x,y)&&orbit.id===null&&joy.id===null){orbit.id=e.pointerId;orbit.lx=x;orbit.ly=y;try{cv.setPointerCapture(e.pointerId);}catch(_){}}});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId===joy.id){joyMove(e.clientX,e.clientY);return;}
  if(e.pointerId===orbit.id){const dx=e.clientX-orbit.lx;orbit.lx=e.clientX;orbit.ly=e.clientY;yaw-=dx*0.008;setCam();hintT=0;}});
function jUp(e){if(e.pointerId===joy.id){joy.id=null;joy.active=false;joy.dx=joy.dy=0;}if(e.pointerId===orbit.id)orbit.id=null;}
cv.addEventListener('pointerup',jUp);cv.addEventListener('pointercancel',jUp);
['touchstart','touchmove','gesturestart','dblclick','contextmenu'].forEach(t=>document.addEventListener(t,e=>{if(pp.contains(e.target))return;if(e.target===cv||t!=='touchstart')e.preventDefault();},{passive:false}));
addEventListener('keydown',e=>{unlock();keys[e.key]=1;if(e.key===' '||e.key==='Enter'){e.preventDefault();drop();}});
addEventListener('keyup',e=>{keys[e.key]=0;});
function circ(x,y,r,fill,lw){g.beginPath();g.arc(x,y,r,0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill();}if(lw){g.lineWidth=lw;g.strokeStyle=OL;g.stroke();}}
function ell(x,y,rx,ry,fill,lw){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill();}if(lw){g.lineWidth=lw;g.strokeStyle=OL;g.stroke();}}
let drop=function(){unlock();if(C.st!=='idle')return;if(credits<=0){say('INSERT A TICKET');return;}credits--;C.st='down';C.t=0;btnDown=.25;sCoin();
  tgt=nearest();const d=tgt?Math.hypot(tgt.x-C.x,tgt.z-C.z):9;C.target=(tgt&&!tgt.fall&&tgt.y<=BIN+.01&&d<GR)?BIN+HOFF:0.62;if(C.target<.9)tgt=null;};
// prong geometry: theta = splay angle of upper segment
function prongs(){const th=0.12+C.open*1.2,out=[];
  for(let k=0;k<3;k++){const a=k*2*Math.PI/3-Math.PI/2,D=[Math.cos(a),0,Math.sin(a)];
    const p0=[C.x+D[0]*.1*CS,C.y-.08*CS,C.z+D[2]*.1*CS],p1=[p0[0]+D[0]*.5*CS*Math.sin(th),p0[1]-.5*CS*Math.cos(th),p0[2]+D[2]*.5*CS*Math.sin(th)];
    const t2=th-1.35,p2=[p1[0]+D[0]*.28*CS*Math.sin(t2),p1[1]-.28*CS*Math.cos(t2),p1[2]+D[2]*.28*CS*Math.sin(t2)];out.push([p0,p1,p2]);}return out;}
function update(dt){
  let mx=joy.dx,mz=joy.dy;if(keys.ArrowLeft||keys.a)mx=-1;if(keys.ArrowRight||keys.d)mx=1;if(keys.ArrowUp||keys.w)mz=-1;if(keys.ArrowDown||keys.s)mz=1;
  let moving=false;const lim=(v,m)=>Math.max(-m,Math.min(m,v));
  if(C.st==='idle'){C.open=Math.max(.0,C.open-dt);if(Math.abs(mx)>.08||Math.abs(mz)>.08){
    const rx=Rr[0],rz=Rr[2],rl=Math.hypot(rx,rz)||1,fx=-F[0],fz=-F[2],fl=Math.hypot(fx,fz)||1;
    const wx=(rx/rl)*mx+(fx/fl)*mz,wz=(rz/rl)*mx+(fz/fl)*mz;
    C.x=lim(C.x+wx*1.1*dt,CW-.3);C.z=lim(C.z+wz*1.1*dt,CD-.3);moving=true;}}
  else if(C.st==='down'){C.open=Math.min(1,C.open+dt*3);C.y-=dt*.8;moving=true;if(C.y<=C.target){C.y=C.target;C.st='close';C.t=0;sGrab();}}
  else if(C.st==='close'){C.t+=dt;const d=tgt?Math.hypot(tgt.x-C.x,tgt.z-C.z):9,over=C.target>.9&&d<GR;
    const stop=over?0.5:0;C.open=Math.max(stop,1-C.t*2.2);
    if(over&&C.open<=stop+.001&&!C.held){C.held=true;C.grip=1-d/GR;tgt.held=true;tgt.sq=1;sGrab();}
    if(C.t>0.9)C.st='up';}
  else if(C.st==='up'){C.y+=dt*.8;moving=true;
    if(C.held&&C.y>1.4&&!C.slip){C.slip=1;if(Math.random()<.2+.45*(1-C.grip)){C.held=false;tgt.held=false;tgt.vy=0;C.open=.5;sBuzz();say('Slipped! So close…');}}
    if(C.y>=TOPY){C.y=TOPY;C.slip=0;C.st=C.held?'carry':'ret';if(!C.held&&!msgT)say('Missed! Try again');}}
  else if(C.st==='carry'){moving=true;const dx=CHUTE.x-C.x,dz=CHUTE.z-C.z,d=Math.hypot(dx,dz),sp=.8*dt;
    if(d<=sp){C.x=CHUTE.x;C.z=CHUTE.z;C.st='release';C.t=0;}else{C.x+=dx/d*sp;C.z+=dz/d*sp;}}
  else if(C.st==='release'){C.t+=dt;C.open=Math.min(.8,C.open+dt*3);if(C.held&&C.t>.15){C.held=false;tgt.held=false;tgt.fall=true;tgt.vy=0;}if(C.t>.7)C.st='ret';}
  else if(C.st==='ret'){moving=true;C.open=Math.max(0,C.open-dt*2);const dx=HOME.x-C.x,dz=HOME.z-C.z,d=Math.hypot(dx,dz),sp=.9*dt;
    if(d<=sp){C.x=HOME.x;C.z=HOME.z;C.st='idle';}else{C.x+=dx/d*sp;C.z+=dz/d*sp;}}
  setWhir(moving,C.st==='down'||C.st==='up'?55:75);
  // toy
  for(const toy of toys){toy.sq=Math.max(0,toy.sq-dt*1.5);
  if(toy.held){toy.x=C.x;toy.z=C.z;toy.y=C.y-HOFF;toy.yaw=Math.sin(performance.now()/300)*.15;}
  else{toy.vy-=dt*6;toy.y+=toy.vy*dt;const floor=toy.fall?-1.2:BIN;
    if(toy.y<floor){toy.y=floor;if(toy.vy<-1.5&&!toy.fall){toy.vy*=-.3;sClunk();}else toy.vy=0;}
    if(toy.fall&&toy.y<-0.5&&!toy.done){toy.done=1;sClunk();const k=toy.kind,me=toy;shelf.push(k);coll[k]=(coll[k]||0)+1;saveColl();wins++;setTimeout(sJingle,200);say(WINS[k]);setTimeout(()=>{toys=toys.filter(o=>o!==me);if(alive().length<=4)refillBatch();},400);}}
